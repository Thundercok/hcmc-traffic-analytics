version: "3.8"

services:
  # Nginx reverse proxy - serves frontend at /, API docs at /docs
  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../traffic-app/dist:/usr/share/nginx/html:ro
    depends_on:
      - api
    restart: unless-stopped

  # FastAPI backend
  api:
    build: .
    environment:
      - DATABASE_URL=postgresql://trafficflow:trafficpass123@db:5432/trafficflow
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=trafficflow
      - DB_PASSWORD=trafficpass123
      - DB_NAME=trafficflow
      - WRITER_INTERVAL_SECONDS=300
      - TF_HOST=0.0.0.0
      - TF_PORT=8000
    volumes:
      - ./ZIP:/app/ZIP:ro
    restart: unless-stopped

  # PostgreSQL with TimescaleDB
  db:
    image: timescale/timescaledb:latest-pg15
    environment:
      - POSTGRES_USER=trafficflow
      - POSTGRES_PASSWORD=trafficpass123
      - POSTGRES_DB=trafficflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trafficflow -d trafficflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
